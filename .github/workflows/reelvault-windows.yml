name: ReelVault on Windows

on:
  push:
    paths:
      - "reelvault/**"
      - ".github/workflows/reelvault-windows.yml"
  workflow_dispatch:

jobs:
  install-and-run:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Run the one-paste installer (from this checkout)
        shell: powershell
        run: .\reelvault\install.ps1 -Source .\reelvault -NoLaunch

      - name: Check what got installed
        shell: powershell
        run: |
          $rv = "$env:USERPROFILE\ReelVault"
          & "$rv\tools\ffmpeg\bin\ffmpeg.exe" -version | Select-Object -First 1
          & "$rv\app-env\Scripts\python.exe" -c "import reelvault.app, faster_whisper, instaloader, yt_dlp; print('imports ok')"
          if (-not (Test-Path "$env:USERPROFILE\Desktop\ReelVault.lnk")) { throw "desktop icon missing" }
          if (-not (Test-Path "$rv\chrome-extension\manifest.json")) { throw "installer did not create the extension folder" }
          & "$env:USERPROFILE\.local\bin\claude.exe" --version

      - name: Run the test suite
        shell: powershell
        run: |
          $rv = "$env:USERPROFILE\ReelVault"
          $env:PATH = "$rv\tools\ffmpeg\bin;$env:PATH"
          & "$rv\app-env\Scripts\python.exe" -m pip install pytest --quiet
          # Desktop app tests only: the server, MCP, web and extension suites need the [server] packages, node and
          # Playwright, which the desktop install does not have (they run in reelvault-members.yml on Linux).
          & "$rv\app-env\Scripts\python.exe" -m pytest -q reelvault\tests --ignore=reelvault\tests\server --ignore=reelvault\tests\mcp --ignore=reelvault\tests\web --ignore=reelvault\tests\ext --ignore=reelvault\tests\e2e --ignore=reelvault\tests\journey
          if ($LASTEXITCODE -ne 0) { throw "tests failed" }

      - name: Start the app the way the desktop icon does, and use it
        shell: powershell
        run: |
          $rv = "$env:USERPROFILE\ReelVault"
          Start-Process "$rv\app-env\Scripts\pythonw.exe" -ArgumentList "-m reelvault.app --no-browser" -WorkingDirectory $rv
          Start-Sleep -Seconds 15
          $s = Invoke-RestMethod http://127.0.0.1:8765/api/status
          $s | Select-Object home, ffmpeg, claude, instagram, counts | ConvertTo-Json
          if (-not $s.ffmpeg) { throw "app cannot find ffmpeg" }
          if (-not $s.claude.installed) { throw "app cannot find Claude Code" }
          $r = Invoke-RestMethod -Method Post -ContentType "application/json" -Body '{"time":"20:00"}' http://127.0.0.1:8765/api/schedule
          $r | ConvertTo-Json
          if ($r.error) { throw "schedule failed: $($r.error)" }
          schtasks /Query /TN "ReelVault daily" /FO LIST
          Invoke-RestMethod -Method Post -ContentType "application/json" -Body '{"time":null}' http://127.0.0.1:8765/api/schedule | Out-Null
          Invoke-RestMethod -Method Post -ContentType "application/json" -Body '{}' http://127.0.0.1:8765/api/quit | Out-Null
          if (-not (Test-Path "$rv\chrome-extension\manifest.json")) { throw "Chrome extension folder missing" }

      - name: Chrome extension login, end to end (real Chromium)
        shell: powershell
        run: |
          $rv = "$env:USERPROFILE\ReelVault"
          $tmp = "$env:RUNNER_TEMP\rvhome"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          npm install --no-save --prefix "$env:RUNNER_TEMP\pw" playwright@1.63.0
          & "$env:RUNNER_TEMP\pw\node_modules\.bin\playwright.cmd" install chromium
          Start-Process "$rv\app-env\Scripts\python.exe" -ArgumentList "reelvault\tests\e2e\run_app.py", $tmp -RedirectStandardOutput "$env:RUNNER_TEMP\app.out" -RedirectStandardError "$env:RUNNER_TEMP\app.err"
          Start-Sleep -Seconds 10
          $env:NODE_PATH = "$env:RUNNER_TEMP\pw\node_modules"
          node reelvault\tests\e2e\extension_e2e.js $tmp
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:RUNNER_TEMP\app.err" -Tail 30; throw "extension e2e failed" }

      - name: Reinstall while the app is running (update path)
        shell: powershell
        run: |
          $rv = "$env:USERPROFILE\ReelVault"
          Start-Process "$rv\app-env\Scripts\pythonw.exe" -ArgumentList "-m reelvault.app --no-browser" -WorkingDirectory $rv
          Start-Sleep -Seconds 10
          .\reelvault\install.ps1 -Source .\reelvault -NoLaunch -SkipClaude
          $left = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like "*reelvault.app*" }
          if ($left) { throw "old app still running after reinstall" }
          Start-Process "$rv\app-env\Scripts\pythonw.exe" -ArgumentList "-m reelvault.app --no-browser" -WorkingDirectory $rv
          Start-Sleep -Seconds 10
          $s = Invoke-RestMethod http://127.0.0.1:8765/api/status
          "running version: $($s.version)"
          if (-not $s.version) { throw "new version not running" }
          if (-not (Test-Path "$rv\chrome-extension\manifest.json")) { throw "extension folder missing" }
          Invoke-RestMethod -Method Post -ContentType "application/json" -Body '{}' http://127.0.0.1:8765/api/quit | Out-Null

      - name: ReelVault Members on this computer (localhost installer)
        shell: powershell
        run: |
          .\reelvault\install-members.ps1 -Source .\reelvault -NoLaunch -NoWhisper
          $rvm = "$env:USERPROFILE\ReelVault-Members"
          if (-not (Test-Path "$rvm\chrome-extension\manifest.json")) { throw "extension folder missing" }
          if (-not (Test-Path "$env:USERPROFILE\Desktop\ReelVault Members.lnk")) { throw "desktop icon missing" }
          Start-Process "$rvm\env\Scripts\pythonw.exe" -ArgumentList "-m reelvault.members_local --no-browser" -WorkingDirectory $rvm
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try { $h = Invoke-RestMethod http://localhost:8800/healthz -TimeoutSec 3; $ok = $true; break } catch { Start-Sleep -Seconds 2 }
          }
          if (-not $ok) { Get-Content "$rvm\members.log" -Tail 40 -ErrorAction SilentlyContinue; throw "members app did not start" }
          $h | ConvertTo-Json -Depth 4
          $pw = ((Get-Content "$rvm\login.txt") | Where-Object { $_ -like "Password:*" }) -replace "Password:\s*", ""
          $s = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          $body = @{ email = "owner@reelvault.local"; password = $pw } | ConvertTo-Json
          $r = Invoke-RestMethod -Method Post -Uri http://localhost:8800/api/auth/login -Body $body -ContentType "application/json" -Headers @{ Origin = "http://localhost:8800" } -WebSession $s
          $me = Invoke-RestMethod -Uri http://localhost:8800/api/me -WebSession $s
          "signed in as $($me.email) role=$($me.role) ai_mode=$($me.ai_mode)"
          if ($me.role -ne "admin") { throw "owner login failed" }
          $page = Invoke-WebRequest -UseBasicParsing http://localhost:8800/
          if ($page.StatusCode -ne 200) { throw "web app page did not load" }
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like "*reelvault.members_local*" } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
