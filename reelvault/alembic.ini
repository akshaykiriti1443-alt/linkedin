# Alembic config for ReelVault Members (WP1). The app runs migrations itself (db.migrate()); this file is for
# developers: `alembic revision --autogenerate -m "..."` with DATABASE_URL pointing at a scratch database.
[alembic]
script_location = migrations

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
