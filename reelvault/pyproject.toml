[project]
name = "reelvault"
version = "0.3.0"
description = "Turn your saved Instagram reels into transcripts, hook/meat/CTA skeletons, scripts and a knowledge base."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.6",
    "pydantic>=2.7",
    "instaloader>=4.14",
    "browser-cookie3>=0.20",
    "websocket-client>=1.6",
    "yt-dlp>=2025.1.1",
    "faster-whisper>=1.1",
    "python-dotenv>=1.0",
]

[project.scripts]
reelvault = "reelvault.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["reelvault"]

[tool.setuptools.package-data]
reelvault = ["extension/*"]
