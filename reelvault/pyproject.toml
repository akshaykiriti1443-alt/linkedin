[project]
name = "reelvault"
version = "0.4.0"
description = "Turn your saved Instagram reels into transcripts, hook/meat/CTA skeletons, scripts and a knowledge base."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.6",
    "pydantic>=2.7",
    "instaloader>=4.14",
    "browser-cookie3>=0.20",
    "websocket-client>=1.6",
    "yt-dlp>=2025.1.1",
    "faster-whisper>=1.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.120", "uvicorn[standard]>=0.32", "sqlalchemy>=2.0.36", "alembic>=1.14", "psycopg[binary]>=3.2",
  "argon2-cffi>=23.1", "cryptography>=43", "python-multipart>=0.0.12", "httpx>=0.28",
  "mcp>=2.3,<3", "sherpa-onnx==2.0.1", "numpy>=2.1", "trafilatura==2.3.1", "pypdf>=5",
  "openai>=3.48", "google-genai>=3.0", "opencv-python-headless>=4.10", "anyio>=4.6",
]

[project.scripts]
reelvault = "reelvault.cli:main"
reelvault-start = "reelvault.server.supervise:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["reelvault", "reelvault.server", "reelvault.ai", "reelvault.signals", "reelvault.importers"]

[tool.setuptools.package-data]
reelvault = ["extension/*", "ui/*", "data/*", "web/*", "web/static/*", "web/static/*/*", "web/copy/*", "ai/prompts/*", "server/data/*"]
